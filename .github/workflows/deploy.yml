name: Deploy static site to GitHub Pages

on:
  # Deploy on every push to the main branch
  push:
    branches: [main]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Permissions required to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # prev-versions/ is an archived copy of the old site (outdated team info and a
      # contact form that doesn't send anywhere). Keep it in the repo, but don't publish it.
      # This only deletes it from the runner's throwaway checkout, not from the repo.
      - name: Exclude archived pages from the published site
        run: rm -rf prev-versions

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The rest of the repo is the static site (no build step needed)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
